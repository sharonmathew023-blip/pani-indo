<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pani Indo 🛠️</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family:sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
}

input,select,button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:12px;
    border:1px solid #ccc;
}

button{
    background:black;
    color:white;
    border:none;
}

.card{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:14px;
}

</style>

</head>

<body>

<div class="container">

<h1>Pani Indo 🛠️</h1>

<select id="category">
<option value="Aale Venam">Aale Venam</option>
<option value="Pani Venam">Pani Venam</option>
</select>

<input id="title" placeholder="Work">
<input id="location" placeholder="Location">
<input id="pincode" placeholder="Pincode">
<input id="wage" placeholder="Wage">
<input id="phone" placeholder="Phone">

<button onclick="postPani()">Post</button>

<input id="searchLocation" placeholder="Search Location">

<button onclick="fetchPosts()">Search</button>

<div id="feed">
Loading...
</div>

</div>

<script>

const supabase = window.supabase.createClient(
  "https://kiboqjbbhssggooptyxh.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpYm9xamJiaHNzZ2dvb3B0eXhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MTc0NTgsImV4cCI6MjA5NDM5MzQ1OH0.auZwe5CUKAJY8Cg2ZM3qXbhLDixA44fJRF0Nj4eIxKU"
);



async function fetchPosts(){

    const feed = document.getElementById("feed");

    feed.innerHTML = "Loading...";

    let query = supabase
        .from("pani_posts")
        .select("*")
        .order("created_at", {ascending:false});

    const search =
        document.getElementById("searchLocation")
        .value
        .trim();

    if(search){
        query = query.ilike("location", `%${search}%`);
    }

    const {data,error} = await query;

    console.log(data,error);

    if(error){

        feed.innerHTML = error.message;

        return;
    }

    if(!data || data.length===0){

        feed.innerHTML = "No posts yet";

        return;
    }

    feed.innerHTML = "";

    data.forEach(post=>{

        feed.innerHTML += `

        <div class="card">

        <b>${post.category}</b>

        <h3>${post.title}</h3>

        <p>📍 ${post.location}</p>

        <p>💰 ${post.wage}</p>

        <a href="https://wa.me/91${post.phone}">
        WhatsApp
        </a>

        </div>

        `;
    });
}



async function postPani(){

    const data = {

        category:
            document.getElementById("category").value,

        title:
            document.getElementById("title").value,

        location:
            document.getElementById("location").value,

        pincode:
            document.getElementById("pincode").value,

        wage:
            document.getElementById("wage").value,

        phone:
            document.getElementById("phone").value
    };


    const {error} = await supabase
        .from("pani_posts")
        .insert([data]);

    console.log(error);

    if(error){

        alert(error.message);

        return;
    }

    alert("Posted ✅");

    fetchPosts();
}


fetchPosts();

</script>

</body>
</html>
