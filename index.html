<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pani Indo 🛠️</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { font-family:sans-serif; padding:15px; background:#fdfbf7; }
h1 { text-align:center; }

input, select, button {
    width:100%;
    padding:10px;
    margin-top:8px;
    border-radius:10px;
}

.card {
    background:white;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
}
</style>
</head>

<body>

<h1>Pani Indo 🛠️</h1>

<select id="category">
<option value="Aale Venam">Aale Venam</option>
<option value="Pani Venam">Pani Venam</option>
</select>

<input id="title" placeholder="Work (Eg: Catering)">
<input id="location" placeholder="Area">
<input id="pincode" placeholder="Pincode">
<input id="wage" placeholder="Wage">
<input id="phone" placeholder="Phone">

<button onclick="postPani()">Post</button>

<br><br>

<input id="searchLocation" placeholder="Search location">
<button onclick="fetchPosts()">Search</button>

<div id="feed">Loading...</div>

<script>
// ✅ REAL VALUES ADDED
const supabase = window.supabase.createClient(
  "https://kkxjvpilkhpuqsiucudg.supabase.co",
  "sb_publishable_hcXBzTNq6UXM9GpIlN1BWg_-ahmb197"
);

// 🔍 FETCH POSTS
async function fetchPosts() {
    const feed = document.getElementById("feed");
    feed.innerHTML = "Loading...";

    let query = supabase
        .from("pani_posts")
        .select("*")
        .order("created_at", { ascending:false });

    const search = document.getElementById("searchLocation").value;

    if (search) {
        query = query.ilike("location", `%${search}%`);
    }

    const { data, error } = await query;

    console.log("FETCH:", data, error);

    if (error) {
        feed.innerHTML = "Error loading";
        return;
    }

    if (!data || data.length === 0) {
        feed.innerHTML = "No posts yet";
        return;
    }

    feed.innerHTML = "";

    data.forEach(post => {
        feed.innerHTML += `
        <div class="card">
            <b>${post.category}</b>
            <h3>${post.title}</h3>
            <p>${post.location || ""}</p>
            <p>${post.wage || ""}</p>
            <a href="https://wa.me/91${post.phone}" target="_blank">WhatsApp</a>
        </div>`;
    });
}

// 📤 POST DATA
async function postPani() {

    const data = {
        category: document.getElementById("category").value,
        title: document.getElementById("title").value,
        location: document.getElementById("location").value,
        pincode: document.getElementById("pincode").value,
        wage: document.getElementById("wage").value,
        phone: document.getElementById("phone").value
    };

    // validation
    if (!data.title || !data.phone) {
        alert("Fill required fields");
        return;
    }

    if (!/^[0-9]{10}$/.test(data.phone)) {
        alert("Invalid phone");
        return;
    }

    const { error } = await supabase
        .from("pani_posts")
        .insert([data]);

    console.log("INSERT:", error);

    if (error) {
        alert("Error posting");
        return;
    }

    alert("Posted ✅");

    document.getElementById("title").value = "";

    fetchPosts();
}

// 🚀 LOAD ON START
fetchPosts();

</script>

</body>
</html>
